<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Clip Beta • Offline review</title>
<style>body{font:16px system-ui;background:#101525;color:#eef1fb;max-width:1000px;margin:36px auto;padding:0 22px}h1{font-size:32px}p{color:#b9c4df}article{background:#1c2540;border:1px solid #344267;border-radius:14px;padding:20px;margin:16px 0}textarea{box-sizing:border-box;width:100%;min-height:72px;background:#11182b;color:white;border:1px solid #617098;border-radius:6px;padding:12px;font:inherit}select,button{padding:10px;background:#27375f;color:white;border:1px solid #647caf;border-radius:6px;margin:5px}button{cursor:pointer}label{display:inline-block;margin:5px}small{color:#b9c4df}.preview{padding:20px;text-align:center;background:#090e19;border-radius:8px;white-space:pre-wrap;font-size:24px;overflow-wrap:anywhere}#save{background:#396cdf}header{position:sticky;top:0;background:#101525;padding:12px 0;z-index:1}</style>
<header><h1>Clip Beta / レビュー</h1><p>ローカル字幕の編集案。この画面は映像・音声・Premiereを変更しません。保存後にローカルMP4へレンダリングできます。保存後、CLIで検証・書き出ししてください。</p><button id="adopt">全て採用</button><button id="reject">全て不採用</button><button id="save">レビューJSONを保存</button><span id="count"></span></header><main id="cards"></main>
<script>"use strict";
const p = {"schema": "clipbeta/1", "kind": "proposal", "source_id": "src_cf9f0406e7d8028962fdf278", "clip_id": "clip_6164fc20987a0c59be12ce0f", "backend": "rules-v1", "media_duration_ms": 15000, "range_start_ms": 0, "range_end_ms": 10000, "items": [{"id": "cue_a6e6ad432cb770755d8619d3", "source_start_ms": 0, "source_end_ms": 3000, "start_ms": 0, "end_ms": 3000, "original_text": "この子かわいいね", "text": "この子かわいいね", "style": {"emphasis": false, "color": "white", "se": "none", "zoom": "none", "spans": [{"start": 3, "end": 7, "color": "pink", "emphasis": true}], "zoom_target": {"x": 0.5, "y": 0.5}}, "reason": "Literal keyword match; no semantic AI", "status": "pending"}, {"id": "cue_9cb1bb5cef5223d4d0bc138d", "source_start_ms": 3000, "source_end_ms": 6000, "start_ms": 3000, "end_ms": 6000, "original_text": "それは残念だったね", "text": "それは残念だったね", "style": {"emphasis": false, "color": "white", "se": "none", "zoom": "punch_in", "spans": [{"start": 3, "end": 5, "color": "cyan", "emphasis": true}], "zoom_target": {"x": 0.85, "y": 0.25}}, "reason": "Literal keyword match; no semantic AI", "status": "pending"}, {"id": "cue_2df574cd8b69c8d01e005bda", "source_start_ms": 6000, "source_end_ms": 10000, "start_ms": 6000, "end_ms": 10000, "original_text": "この子かわいいね", "text": "この子かわいいね", "style": {"emphasis": false, "color": "white", "se": "none", "zoom": "slow_in", "spans": [{"start": 3, "end": 7, "color": "pink", "emphasis": true}], "zoom_target": {"x": 0.15, "y": 0.75}}, "reason": "Literal keyword match; no semantic AI", "status": "pending"}]};
const cards=document.getElementById('cards');
const colors={white:'#ffffff',yellow:'#ffdf58',red:'#ff7878',cyan:'#63e4ee',pink:'#ff8ed1'};
function el(tag,text){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;return x}
function select(label,values,current,change){const l=el('label',label+' '),s=el('select');for(const value of values){const o=el('option',value);o.value=value;s.append(o)}s.value=current;s.onchange=()=>change(s.value);l.append(s);return l}
function count(){document.getElementById('count').textContent=p.items.filter(x=>x.status==='pending').length+' 件 未確認'}
function render(){cards.replaceChildren();for(const item of p.items){const a=el('article');a.append(el('small',(item.start_ms/1000).toFixed(3)+'–'+(item.end_ms/1000).toFixed(3)+'s · '+item.reason));const input=el('textarea');input.value=item.text;input.maxLength=4000;input.setAttribute('aria-label','字幕');const preview=el('div',item.text);preview.className='preview';function paint(){preview.textContent='';preview.replaceChildren();const chars=Array.from(item.text),spans=item.style.spans||[];if(!spans.length)preview.textContent=item.text;else{let at=0;for(const span of spans){preview.append(el('span',chars.slice(at,span.start).join('')));const word=el('span',chars.slice(span.start,span.end).join(''));word.style.color=colors[span.color];word.style.fontWeight=span.emphasis?'800':'400';preview.append(word);at=span.end}preview.append(el('span',chars.slice(at).join('')))}preview.style.color=colors[item.style.color];preview.style.fontWeight=item.style.emphasis?'800':'400'}input.oninput=()=>{item.text=input.value;item.style.spans=[];paint();count()};a.append(input);a.append(select('状態',['pending','adopted','rejected'],item.status,v=>{item.status=v;count()}));a.append(select('色',Object.keys(colors),item.style.color,v=>{item.style.color=v;paint()}));a.append(select('SE',['none','pop','surprise','laugh'],item.style.se,v=>item.style.se=v));a.append(select('ズーム',['none','punch_in','slow_in'],item.style.zoom,v=>item.style.zoom=v));const label=el('label','強調 '),check=el('input');check.type='checkbox';check.checked=item.style.emphasis;check.onchange=()=>{item.style.emphasis=check.checked;paint()};label.append(check);a.append(label);const wordHelp=el('small','字幕を選択して単語装飾。字幕本文を変更すると単語装飾は解除されます。');a.append(wordHelp);
for(const color of ['pink','cyan']){const b=el('button',color==='pink'?'選択語をピンク':'選択語を水色');b.onclick=()=>{const start=Array.from(input.value.slice(0,input.selectionStart)).length,end=Array.from(input.value.slice(0,input.selectionEnd)).length;if(start===end){wordHelp.textContent='先に字幕本文の単語を選択してください';return}const spans=(item.style.spans||[]).filter(s=>s.end<=start||s.start>=end);spans.push({start,end,color,emphasis:true});spans.sort((a,b)=>a.start-b.start);item.style.spans=spans;paint()};a.append(b)}const clear=el('button','単語装飾なし');clear.onclick=()=>{item.style.spans=[];paint()};a.append(clear);
for(const axis of ['x','y']){const l=el('label','ズーム中心 '+axis+' (0–1) '),n=el('input');n.type='number';n.min='0';n.max='1';n.step='0.05';n.value=(item.style.zoom_target||{x:0.5,y:0.5})[axis];n.oninput=()=>{item.style.zoom_target=item.style.zoom_target||{x:0.5,y:0.5};item.style.zoom_target[axis]=n.value===''?NaN:Number(n.value)};l.append(n);a.append(l)}a.append(preview);paint();cards.append(a)}count()}
document.getElementById('adopt').onclick=()=>{p.items.forEach(x=>x.status='adopted');render()};
document.getElementById('reject').onclick=()=>{p.items.forEach(x=>x.status='rejected');render()};
document.getElementById('save').onclick=()=>{for(const item of p.items){const t=item.style.zoom_target||{x:.5,y:.5};if(!item.text.trim()||![t.x,t.y].every(v=>Number.isFinite(v)&&v>=0&&v<=1)){document.getElementById('count').textContent='字幕またはズーム座標を確認してください';return}}const review={schema:p.schema,clip_id:p.clip_id,decisions:p.items.map(({id,status,text,style})=>({id,status,text,style}))};const blob=new Blob([JSON.stringify(review,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=el('a');link.href=url;link.download='review.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();</script></html>
