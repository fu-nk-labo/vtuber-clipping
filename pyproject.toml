[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vtuber-clipping-beta"
dynamic = ["version"]
description = "Local AI transcription, evidence-based clip review and video rendering"
authors = [{name = "FU-NK LABO"}]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Source = "https://github.com/fu-nk-labo/vtuber-clipping"
Issues = "https://github.com/fu-nk-labo/vtuber-clipping/issues"

[project.optional-dependencies]
render = ["Pillow>=10,<13"]
twitch = ["yt-dlp==2026.8.19"]
local-ai = ["Pillow>=10,<13", "faster-whisper==1.2.1", "av==16.0.1"]

[project.scripts]
clipbeta = "clipbeta.__main__:main"

[tool.setuptools]
packages = ["clipbeta"]

[tool.setuptools.dynamic]
version = {attr = "clipbeta.__version__"}

[tool.setuptools.package-data]
clipbeta = ["web/*.js", "web/*.html", "data/*.srt"]
